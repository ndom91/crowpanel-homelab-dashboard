# Dashboard layout: 792x272, pure black/white.
#
#   y   0- 34  header: title | HA / Wi-Fi / clock   (offline banner overlays it)
#   y  44-152  CPU | MEMORY | GPU: caption, big value, bar
#   y 168-224  six service tiles
#   y 242-262  footer: public IPv4 | IPv6 | last data
#
# Widgets hold only static styling. Values and states are written by the
# `render` script (refresh.yaml) through include/dashboard.h.

substitutions:
  # Service tile names. Empty string hides the tile.
  svc1_name: "service-1"
  svc2_name: "service-2"
  svc3_name: "service-3"
  svc4_name: "service-4"
  svc5_name: "service-5"
  svc6_name: "service-6"

esphome:
  includes:
    # Relative to this file, so it resolves from a remote git package too.
    - ../include/dashboard.h

font:
  # 1 bpp everywhere: anti-aliased glyphs smear on a binary panel.
  - file: "gfonts://Inter@700"
    id: font_title
    size: 20
    bpp: 1
    extras:
      - file: { type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf" }
        glyphs: ["\U000F07D0", "\U000F0026", "\U000F0928", "\U000F0925", "\U000F0922", "\U000F091F", "\U000F092E"]
  - file: "gfonts://Inter@600"
    id: font_body
    size: 17
    bpp: 1
    extras:
      - file: { type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf" }
        glyphs: ["\U000F05E0", "\U000F0159", "\U000F0625"]
  - file: "gfonts://Inter@700"
    id: font_small
    size: 13
    bpp: 1
  - file: "gfonts://Inter@800"
    id: font_big
    size: 64
    bpp: 1
    glyphs: "0123456789-% "

lvgl:
  displays: epd
  buffer_size: 25%
  color_depth: 16
  default_font: font_body
  disp_bg_color: 0xFFFFFF
  on_draw_end:
    component.update: epd
  style_definitions:
    - id: box
      bg_color: 0xFFFFFF
      bg_opa: COVER
      text_color: 0x000000
      border_width: 0
      radius: 0
      pad_all: 0
    - id: tile
      bg_color: 0xFFFFFF
      bg_opa: COVER
      text_color: 0x000000
      border_color: 0x000000
      border_width: 3
      radius: 0
      pad_all: 6
    - id: chip # caption; inverts when the value crosses the alert threshold
      bg_color: 0xFFFFFF
      bg_opa: COVER
      text_color: 0x000000
      pad_left: 4
      pad_right: 4
      pad_top: 1
      pad_bottom: 1
    - id: rule
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
    - id: bar_track
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x000000
      border_width: 2
      radius: 0
      pad_all: 3
  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        # --- header
        - label: { id: lbl_title, x: 12, y: 6, text: "HOMELAB", text_font: font_title, styles: chip }
        - label: { id: lbl_status, align: TOP_RIGHT, x: -12, y: 6, text: "", text_font: font_title, text_color: 0x000000 }
        - obj: { x: 0, y: 34, width: 792, height: 2, styles: rule }

        # --- CPU column
        - label: { id: cap_cpu, x: 12, y: 44, text: "CPU", text_font: font_small, styles: chip }
        - label: { id: val_cpu, x: 12, y: 64, text: "--", text_font: font_big }
        - label: { id: note_cpu, x: 162, y: 110, text: "", text_font: font_small }
        - bar:
            id: bar_cpu
            x: 12
            y: 138
            width: 240
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            styles: bar_track
            indicator: { bg_color: 0x000000, bg_opa: COVER, radius: 0 }

        # --- MEMORY column
        - label: { id: cap_mem, x: 276, y: 44, text: "MEMORY", text_font: font_small, styles: chip }
        - label: { id: val_mem, x: 276, y: 64, text: "--", text_font: font_big }
        - label: { id: note_mem, x: 426, y: 110, text: "", text_font: font_small }
        - bar:
            id: bar_mem
            x: 276
            y: 138
            width: 240
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            styles: bar_track
            indicator: { bg_color: 0x000000, bg_opa: COVER, radius: 0 }

        # --- GPU column
        - label: { id: cap_gpu, x: 540, y: 44, text: "GPU", text_font: font_small, styles: chip }
        - label: { id: val_gpu, x: 540, y: 64, text: "--", text_font: font_big }
        - label: { id: note_gpu, x: 690, y: 110, text: "", text_font: font_small }
        - bar:
            id: bar_gpu
            x: 540
            y: 138
            width: 240
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            styles: bar_track
            indicator: { bg_color: 0x000000, bg_opa: COVER, radius: 0 }

        - obj: { x: 264, y: 44, width: 2, height: 108, styles: rule }
        - obj: { x: 528, y: 44, width: 2, height: 108, styles: rule }
        - obj: { x: 0, y: 160, width: 792, height: 2, styles: rule }

        - obj:
            id: tile1
            x: 12
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile1_title, x: 0, y: 0, text: "${svc1_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile1_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        - obj:
            id: tile2
            x: 141
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile2_title, x: 0, y: 0, text: "${svc2_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile2_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        - obj:
            id: tile3
            x: 270
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile3_title, x: 0, y: 0, text: "${svc3_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile3_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        - obj:
            id: tile4
            x: 399
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile4_title, x: 0, y: 0, text: "${svc4_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile4_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        - obj:
            id: tile5
            x: 528
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile5_title, x: 0, y: 0, text: "${svc5_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile5_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        - obj:
            id: tile6
            x: 657
            y: 168
            width: 119
            height: 56
            styles: tile
            widgets:
              - label: { id: tile6_title, x: 0, y: 0, text: "${svc6_name}", text_font: font_body, long_mode: CLIP, width: 103 }
              - label: { id: tile6_status, x: 0, y: 24, text: "NO DATA", text_font: font_small }

        # --- footer
        - obj: { x: 0, y: 232, width: 792, height: 2, styles: rule }
        - label: { id: lbl_ip4, x: 12, y: 242, text: "v4 --", text_font: font_body, text_color: 0x000000 }
        - label: { id: lbl_ip6, x: 230, y: 242, text: "v6 --", text_font: font_body, text_color: 0x000000 }
        - label: { id: lbl_upd, align: TOP_RIGHT, x: -12, y: 242, text: "", text_font: font_body, text_color: 0x000000 }

        # --- offline / waiting banner. Last so it draws over the header.
        - obj:
            id: banner
            x: 0
            y: 0
            width: 792
            height: 36
            hidden: true
            styles: rule
            widgets:
              - label: { id: lbl_banner, align: CENTER, text: "", text_font: font_title, text_color: 0xFFFFFF }
