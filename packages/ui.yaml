# Dashboard layout ("1b"): 792x272, pure black/white.
#
#   y   0- 30  header bar (black): title | HA link, Wi-Fi bars, clock
#   y  30-194  CPU | MEMORY | GPU: caption, big value, 243x96 hatched chart, axis
#   y 194-248  2px rule + six service cells (132px, 1px dividers)
#   y 248-272  2px rule + footer: IPv4 | IPv6 | host uptime (monospace)
#
# Widgets hold only static styling. Values and states are written by the
# `render` script (refresh.yaml) through include/dashboard.h, which looks
# widgets up by the ids below. Keep the ids if you rework the layout.

substitutions:
  # Header text. Set your own in the top-level config (kept out of the repo).
  header_title: "homelab"
  ha_label: "home assistant"
  # Service cell names. Empty string hides the cell. ~9 characters fit.
  svc1_name: "service-1"
  svc2_name: "service-2"
  svc3_name: "service-3"
  svc4_name: "service-4"
  svc5_name: "service-5"
  svc6_name: "service-6"

esphome:
  includes:
    # Relative to this file, so it resolves from a remote git package too.
    - ../include/dashboard.h

font:
  # 1 bpp everywhere: anti-aliased glyphs dither or ghost on 1-bit e-paper.
  # At 1 bpp thin strokes break up, so stay at >= 12px and weight >= 700.
  - { file: "gfonts://Montserrat@800", id: f_title, size: 18, bpp: 1 }
  - file: "gfonts://Montserrat@800"
    id: f_value
    size: 32
    bpp: 1
    glyphs: ["0123456789%- ", "—"]
  - { file: "gfonts://Montserrat@700", id: f_name, size: 16, bpp: 1 }
  - { file: "gfonts://Montserrat@700", id: f_small, size: 14, bpp: 1 }
  - { file: "gfonts://Montserrat@800", id: f_note, size: 14, bpp: 1 }
  - { file: "gfonts://Montserrat@700", id: f_axis, size: 12, bpp: 1 }
  - file: { type: gfonts, family: JetBrains Mono, weight: 700 }
    id: f_mono
    size: 13
    bpp: 1

lvgl:
  displays: epd
  buffer_size: 25%
  color_depth: 16
  default_font: f_small
  disp_bg_color: 0xFFFFFF
  on_draw_end:
    component.update: epd
  style_definitions:
    - id: rule
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
    - id: plain # transparent layout container
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
    - id: cell
      bg_color: 0xFFFFFF
      bg_opa: COVER
      text_color: 0x000000
      border_width: 0
      radius: 0
      pad_all: 0
    - id: led
      bg_color: 0x000000
      bg_opa: COVER
      border_color: 0x000000
      border_width: 0
      radius: 5
      pad_all: 0
    - id: bar_on_black # header Wi-Fi bar; filled or outlined in white
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0xFFFFFF
      border_width: 0
      radius: 0
      pad_all: 0
    - id: chip # caption; inverts when the value crosses the alert threshold
      bg_color: 0xFFFFFF
      bg_opa: COVER
      text_color: 0x000000
      pad_left: 3
      pad_right: 3
      pad_top: 1
      pad_bottom: 1
  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      # Pure black default for every label. LVGL's theme default is dark grey,
      # which the 1-bit driver renders as white (invisible).
      text_color: 0x000000
      scrollable: false
      widgets:
        # --- header bar
        - obj:
            x: 0
            y: 0
            width: 792
            height: 30
            styles: rule
            scrollable: false
            widgets:
              - label:
                  id: lbl_title
                  align: LEFT_MID
                  x: 9
                  text: "${header_title}"
                  text_font: f_title
                  text_color: 0xFFFFFF
                  bg_color: 0x000000
                  bg_opa: COVER
                  pad_left: 3
                  pad_right: 3
              - obj:
                  align: RIGHT_MID
                  x: -12
                  width: SIZE_CONTENT
                  height: 30
                  styles: plain
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_main: END
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 18
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: plain
                        layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - obj: { id: led_ha, width: 9, height: 9, styles: led, bg_color: 0xFFFFFF, border_color: 0xFFFFFF }
                          - label: { id: lbl_ha, text: "${ha_label}", text_font: f_name, text_color: 0xFFFFFF }
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: plain
                        layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - obj:
                              width: 18
                              height: 13
                              styles: plain
                              widgets:
                                - obj: { id: wifi_b1, x: 0, y: 9, width: 3, height: 4, styles: bar_on_black }
                                - obj: { id: wifi_b2, x: 5, y: 6, width: 3, height: 7, styles: bar_on_black }
                                - obj: { id: wifi_b3, x: 10, y: 3, width: 3, height: 10, styles: bar_on_black }
                                - obj: { id: wifi_b4, x: 15, y: 0, width: 3, height: 13, styles: bar_on_black }
                          - label: { id: lbl_rssi, text: "-- dBm", text_font: f_name, text_color: 0xFFFFFF }
                    - label: { id: lbl_time, text: "--:--", text_font: f_title, text_color: 0xFFFFFF }

        # --- metrics. Columns at x 0/264/528, 2px rules between them.
        - !include { file: widgets/metric.yaml, vars: { key: cpu, label: CPU, x: 0 } }
        - !include { file: widgets/metric.yaml, vars: { key: mem, label: MEMORY, x: 264 } }
        - !include { file: widgets/metric.yaml, vars: { key: gpu, label: GPU, x: 528 } }
        - obj: { x: 262, y: 30, width: 2, height: 164, styles: rule }
        - obj: { x: 526, y: 30, width: 2, height: 164, styles: rule }

        # --- services: six 132px cells, 1px dividers
        - obj: { x: 0, y: 194, width: 792, height: 2, styles: rule }
        - !include { file: widgets/service_cell.yaml, vars: { n: 1, x: 0, name: "${svc1_name}" } }
        - !include { file: widgets/service_cell.yaml, vars: { n: 2, x: 132, name: "${svc2_name}" } }
        - !include { file: widgets/service_cell.yaml, vars: { n: 3, x: 264, name: "${svc3_name}" } }
        - !include { file: widgets/service_cell.yaml, vars: { n: 4, x: 396, name: "${svc4_name}" } }
        - !include { file: widgets/service_cell.yaml, vars: { n: 5, x: 528, name: "${svc5_name}" } }
        - !include { file: widgets/service_cell.yaml, vars: { n: 6, x: 660, name: "${svc6_name}" } }
        - obj: { x: 132, y: 196, width: 1, height: 52, styles: rule }
        - obj: { x: 264, y: 196, width: 1, height: 52, styles: rule }
        - obj: { x: 396, y: 196, width: 1, height: 52, styles: rule }
        - obj: { x: 528, y: 196, width: 1, height: 52, styles: rule }
        - obj: { x: 660, y: 196, width: 1, height: 52, styles: rule }

        # --- footer
        - obj: { x: 0, y: 248, width: 792, height: 2, styles: rule }
        - label: { id: lbl_ip4, x: 12, y: 252, text: "v4 --", text_font: f_mono }
        - label: { id: lbl_ip6, align: TOP_MID, y: 252, text: "v6 --", text_font: f_mono, long_mode: CLIP }
        - label: { id: lbl_uptime, align: TOP_RIGHT, x: -12, y: 252, text: "uptime --", text_font: f_mono }

        # --- offline / waiting banner. Last so it draws over the header.
        # White on the black header so it reads as "something is wrong".
        - obj:
            id: banner
            x: 0
            y: 0
            width: 792
            height: 30
            hidden: true
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 2
            radius: 0
            pad_all: 0
            widgets:
              - label: { id: lbl_banner, align: CENTER, text: "", text_font: f_name }
