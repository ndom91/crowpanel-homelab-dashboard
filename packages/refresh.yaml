# When and how the screen redraws.
#
# - Sensor callbacks only record that data arrived. The screen redraws on the
#   minute (one partial refresh per minute), plus right away (debounced) when a
#   service changes state or Wi-Fi / HA connectivity changes.
# - Charts keep 31 one-minute samples (-30m .. now). The minute tick shifts
#   them; history starts empty after each reboot.
# - Every `full_refresh_every` renders, and nightly at 03:00, the next refresh
#   is a full one to clear ghosting. Long-press MENU (1-5 s) does the same.

substitutions:
  # Mark the data stale after this long without a Home Assistant connection.
  offline_grace_s: "120"
  # Values at or above this percentage invert their caption.
  alert_pct: "90"
  full_refresh_every: "60" # ~hourly at one render per minute
  # Which raw HA state means "healthy" for each service: "on" for
  # connectivity/running sensors, "off" for problem-class sensors.
  svc1_up_when: "on"
  svc2_up_when: "on"
  svc3_up_when: "on"
  svc4_up_when: "on"
  svc5_up_when: "on"
  svc6_up_when: "on"
  # Set to "true" by data_demo.yaml. Shows a DEMO marker so fake values
  # can never pass for live ones.
  demo_mode: "false"

globals:
  - { id: have_data, type: bool, initial_value: "false" }
  - { id: offline_since_ms, type: uint32_t, initial_value: "0" }
  - { id: offline_since_str, type: std::string, initial_value: '""' }
  - { id: render_count, type: uint32_t, initial_value: "0" }

script:
  # Called from every data source's on_value.
  - id: on_data
    mode: restart
    then:
      - lambda: id(have_data) = true;

  # Service changes should show up without waiting for the minute tick.
  - id: on_service_data
    mode: restart
    then:
      - script.execute: on_data
      - script.execute: render_now

  # Debounced redraw: bursts (boot, HA reconnect replaying every entity)
  # collapse into one e-paper refresh.
  - id: render_now
    mode: restart
    then:
      - delay: 2s
      - script.execute: render

  # Minute tick: advance the chart history by one sample, then redraw.
  - id: tick
    mode: single
    then:
      - lambda: 'for (auto &h : dash::hist) h.shift();'
      - script.execute: render

  # Clean full refresh (clears ghosting): nightly and on MENU long-press.
  - id: full_refresh
    then:
      - lambda: id(epd).force_full_update();
      - lvgl.widget.redraw:

  - id: render
    mode: single
    then:
      - lambda: |-
          using namespace dash;
          const bool demo = ${demo_mode};
          const uint32_t now_ms = millis();
          auto now = id(sntp_time).now();

          // Connectivity -> offline tracking. millis() for the duration so it
          // works before the clock syncs; wall time only for the label.
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          // Only HA subscribes to states; log viewers / dashboards don't, so
          // plain is_connected() would report "HA OK" for a bare log session.
          const bool api_ok = api::global_api_server->is_connected_with_state_subscription();
          if (wifi_ok && api_ok) {
            id(offline_since_ms) = 0;
          } else if (id(offline_since_ms) == 0) {
            id(offline_since_ms) = now_ms | 1;  // 0 means "online"
            id(offline_since_str) = now.is_valid() ? now.strftime("%H:%M") : std::string("");
          }
          const bool stale = !demo && id(offline_since_ms) != 0 &&
                             (now_ms - id(offline_since_ms)) >= ${offline_grace_s} * 1000UL;

          // Ghosting control: periodic full refresh (the first render is full too).
          if (id(render_count)++ % ${full_refresh_every} == 0)
            id(epd).force_full_update();

          // Banner over the header: stale beats waiting; demo shows none.
          std::string banner_text;
          if (stale) {
            banner_text = id(offline_since_str).empty()
                              ? std::string("OFFLINE  -  values are stale")
                              : "OFFLINE since " + id(offline_since_str) + "  -  values are stale";
          } else if (!demo && !id(have_data)) {
            banner_text = "Waiting for Home Assistant...";
          }
          set_hidden(id(banner), banner_text.empty());
          if (!banner_text.empty())
            set_text(id(lbl_banner), banner_text);

          // Header. Demo inverts the title so fake values can't pass as live.
          set_text(id(lbl_title), demo ? "DEMO DATA - NOT LIVE" : "${header_title}");
          set_inverted(id(lbl_title), !demo);  // normally white on the black bar
          set_led(id(led_ha), api_ok, 1, lv_color_white(), lv_color_black());
          const float rssi = id(wifi_rssi).state;
          const int level = wifi_level(wifi_ok, rssi);
          lv_obj_t *bars[4] = {id(wifi_b1), id(wifi_b2), id(wifi_b3), id(wifi_b4)};
          for (int i = 0; i < 4; i++)
            set_led(bars[i], i < level, 1, lv_color_white(), lv_color_black());
          set_text(id(lbl_rssi), (wifi_ok && !std::isnan(rssi)) ? std::to_string((int) rssi) + " dBm"
                                                                : std::string("-- dBm"));
          set_text(id(lbl_time), now.is_valid() ? now.strftime("%a %H:%M") : std::string("--:--"));

          // Metrics. An entity substitution still holding "TODO" is "not wired".
          set_metric(id(val_cpu), id(cap_cpu), id(chart_cpu), id(note_cpu), hist[0], id(d_cpu).state, is_wired("${entity_cpu}"), ${alert_pct});
          set_metric(id(val_mem), id(cap_mem), id(chart_mem), id(note_mem), hist[1], id(d_mem).state, is_wired("${entity_mem}"), ${alert_pct});
          set_metric(id(val_gpu), id(cap_gpu), id(chart_gpu), id(note_gpu), hist[2], id(d_gpu).state, is_wired("${entity_gpu}"), ${alert_pct});

          // Services.
          const int64_t epoch = now.is_valid() ? (int64_t) now.timestamp : 0;
          struct ServiceRow {
            lv_obj_t *cell, *led, *name_lbl, *line2;
            const char *name;
            text_sensor::TextSensor *state;
            const char *up_when;
            text_sensor::TextSensor *uptime;
          };
          const ServiceRow services[6] = {
              {id(svc1), id(svc1_led), id(svc1_name), id(svc1_line2), "${svc1_name}", id(d_svc1), "${svc1_up_when}", id(d_svc1_up)},
              {id(svc2), id(svc2_led), id(svc2_name), id(svc2_line2), "${svc2_name}", id(d_svc2), "${svc2_up_when}", id(d_svc2_up)},
              {id(svc3), id(svc3_led), id(svc3_name), id(svc3_line2), "${svc3_name}", id(d_svc3), "${svc3_up_when}", id(d_svc3_up)},
              {id(svc4), id(svc4_led), id(svc4_name), id(svc4_line2), "${svc4_name}", id(d_svc4), "${svc4_up_when}", id(d_svc4_up)},
              {id(svc5), id(svc5_led), id(svc5_name), id(svc5_line2), "${svc5_name}", id(d_svc5), "${svc5_up_when}", id(d_svc5_up)},
              {id(svc6), id(svc6_led), id(svc6_name), id(svc6_line2), "${svc6_name}", id(d_svc6), "${svc6_up_when}", id(d_svc6_up)},
          };
          for (int i = 0; i < 6; i++) {
            const ServiceRow &r = services[i];
            set_service(i, r.cell, r.led, r.name_lbl, r.line2, r.name,
                        parse_service(r.state->has_state(), r.state->state, r.up_when),
                        r.uptime->has_state(), r.uptime->state, epoch);
          }

          // Footer.
          set_text(id(lbl_ip4), "v4 " + addr_or_dash(id(d_ip4).has_state(), id(d_ip4).state));
          set_text(id(lbl_ip6), "v6 " + addr_or_dash(id(d_ip6).has_state(), id(d_ip6).state));
          const int64_t boot = id(d_uptime).has_state() ? parse_iso8601(id(d_uptime).state) : -1;
          set_text(id(lbl_uptime), (boot > 0 && epoch > 0) ? "uptime " + dur_long(epoch - boot)
                                                           : std::string("uptime --"));

time:
  - id: !extend sntp_time
    on_time:
      # Minute tick: keeps the clock exact and batches value changes.
      - seconds: 0
        then:
          - script.execute: tick
      # Nightly clean full refresh.
      - hours: 3
        minutes: 0
        seconds: 0
        then:
          - script.execute: full_refresh

interval:
  # Fallback tick until SNTP syncs (on_time can't fire before).
  - interval: 60s
    then:
      - if:
          condition:
            lambda: return !id(sntp_time).now().is_valid();
          then:
            - script.execute: tick

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: render_now

binary_sensor:
  - id: !extend btn_menu
    on_click:
      min_length: 1s
      max_length: 5s
      then:
        - script.execute: full_refresh
