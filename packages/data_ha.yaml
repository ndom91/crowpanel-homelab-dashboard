# Live data from Home Assistant over the native API.
#
# Every entity ID is a substitution. The defaults are deliberate TODO
# placeholders; set real IDs in your top-level config (the HA-side stub), not
# here, so they stay out of the public repo. See README "Entity mapping".
#
# Provides the same ids as data_demo.yaml. The data contract is in AGENTS.md.

substitutions:
  entity_cpu: sensor.TODO_proxmox_cpu_percent
  entity_mem: sensor.TODO_proxmox_memory_percent
  entity_gpu: sensor.TODO_gpu_utilization_percent
  entity_ip4: sensor.TODO_public_ipv4
  entity_ip6: sensor.TODO_public_ipv6
  entity_svc1: binary_sensor.TODO_service_1
  entity_svc2: binary_sensor.TODO_service_2
  entity_svc3: binary_sensor.TODO_service_3
  entity_svc4: binary_sensor.TODO_service_4
  entity_svc5: binary_sensor.TODO_service_5
  entity_svc6: binary_sensor.TODO_service_6
  # Uptime entities: device_class "uptime" sensors whose state is the boot
  # time (what the Proxmox VE integration provides).
  entity_uptime: sensor.TODO_host_uptime
  entity_svc1_uptime: sensor.TODO_service_1_uptime
  entity_svc2_uptime: sensor.TODO_service_2_uptime
  entity_svc3_uptime: sensor.TODO_service_3_uptime
  entity_svc4_uptime: sensor.TODO_service_4_uptime
  entity_svc5_uptime: sensor.TODO_service_5_uptime
  entity_svc6_uptime: sensor.TODO_service_6_uptime

sensor:
  # HA "unavailable"/"unknown" arrive as NaN, which the UI renders as "—".
  - { platform: homeassistant, id: d_cpu, entity_id: "${entity_cpu}", internal: true, on_value: [script.execute: on_data] }
  - { platform: homeassistant, id: d_mem, entity_id: "${entity_mem}", internal: true, on_value: [script.execute: on_data] }
  - { platform: homeassistant, id: d_gpu, entity_id: "${entity_gpu}", internal: true, on_value: [script.execute: on_data] }

# Services are read as text, not binary_sensor: ESPHome's HA binary_sensor
# ignores "unavailable" and keeps its last on/off, which would show a dead
# health check as UP. Text keeps the real state so the UI can show "no data".
text_sensor:
  - { platform: homeassistant, id: d_ip4, entity_id: "${entity_ip4}", internal: true, on_value: [script.execute: on_data] }
  - { platform: homeassistant, id: d_ip6, entity_id: "${entity_ip6}", internal: true, on_value: [script.execute: on_data] }
  - { platform: homeassistant, id: d_svc1, entity_id: "${entity_svc1}", internal: true, on_value: [script.execute: on_service_data] }
  - { platform: homeassistant, id: d_svc2, entity_id: "${entity_svc2}", internal: true, on_value: [script.execute: on_service_data] }
  - { platform: homeassistant, id: d_svc3, entity_id: "${entity_svc3}", internal: true, on_value: [script.execute: on_service_data] }
  - { platform: homeassistant, id: d_svc4, entity_id: "${entity_svc4}", internal: true, on_value: [script.execute: on_service_data] }
  - { platform: homeassistant, id: d_svc5, entity_id: "${entity_svc5}", internal: true, on_value: [script.execute: on_service_data] }
  - { platform: homeassistant, id: d_svc6, entity_id: "${entity_svc6}", internal: true, on_value: [script.execute: on_service_data] }
  # Uptimes only change on restart; no redraw needed beyond the minute tick.
  - { platform: homeassistant, id: d_uptime, entity_id: "${entity_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc1_up, entity_id: "${entity_svc1_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc2_up, entity_id: "${entity_svc2_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc3_up, entity_id: "${entity_svc3_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc4_up, entity_id: "${entity_svc4_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc5_up, entity_id: "${entity_svc5_uptime}", internal: true }
  - { platform: homeassistant, id: d_svc6_up, entity_id: "${entity_svc6_uptime}", internal: true }
